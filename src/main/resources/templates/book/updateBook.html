<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>本を編集</title>
	<link rel="stylesheet" th:href="@{/css/updateBook.css}">
</head>

<body>
	<div class="update-book-container">

		<h1>本を編集</h1>

		<form th:action="@{/book/updateBook/{id}(id=${book.id})}"
      method="post"
      class="update-book-form">

    <div class="form-group">
        <label for="title">タイトル</label>
        <input type="text"
               id="title"
               name="title"
               th:value="${book.title}">
    </div>

    <div class="form-group">
        <label for="author">著者</label>
        <input type="text"
               id="author"
               name="author"
               th:value="${book.author}">
    </div>

    <div class="form-group">
        <label for="status">ステータス</label>

        <select id="status" name="status">
            <option value="UNREAD"
                    th:selected="${book.status.name() == 'UNREAD'}">
                未読
            </option>

            <option value="READING"
                    th:selected="${book.status.name() == 'READING'}">
                読書中
            </option>

            <option value="READ"
                    th:selected="${book.status.name() == 'READ'}">
                読了
            </option>
        </select>
    </div>

    <div class="form-actions">
        <a th:href="@{/}"
           class="back-button">
            戻る
        </a>

        <button type="submit"
                class="submit-button">
            更新
        </button>
    </div>

</form>
	</div>

</body>
</html>
