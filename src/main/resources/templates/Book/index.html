<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>本棚</title>

    <link rel="stylesheet" th:href="@{/css/book.css}">
</head>

<body>

    <main class="container">

        <!-- 検索 -->
        <form class="search-form"
              th:action="@{/}"
              method="get">

            <input type="text"
                   name="titleKeyword"
                   placeholder="検索したいキーワード">

            <button type="submit">
                検索
            </button>

        </form>


        <!-- 追加 -->
        <a class="add-button"
           th:href="@{/book/addBook}">
            新しい本の追加
        </a>


        <!-- 本一覧 -->
        <table class="book-table">

            <thead>
                <tr>
                    <th>タイトル</th>
                    <th>著者</th>
                    <th>ステータス</th>
                    <th>登録日</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="book : ${bookList}">
                    <td th:text="${book.title}"></td>
                    <td th:text="${book.author}"></td>
                    <td th:text="${book.status}"></td>
                    <td th:text="${book.createdAt}"></td>
                </tr>
            </tbody>

        </table>

    </main>

</body>

</html>
